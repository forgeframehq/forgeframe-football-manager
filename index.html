<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0b131e"><title>Touchline — Football Manager</title>
<style>
:root{font-family:Inter,ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif;color:#f2f0e8;background:#0a121d;font-synthesis:none}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(ellipse at 60% -15%,#284048 0%,#0a121d 48%)}button,input,select{font:inherit}button{cursor:pointer}button:disabled{opacity:.4;cursor:not-allowed}#app{max-width:480px;min-height:100dvh;margin:auto;padding-bottom:calc(94px + env(safe-area-inset-bottom))}.top{padding:25px 21px 12px;display:flex;align-items:center;justify-content:space-between}.eyebrow{font-size:10px;font-weight:800;color:#d6b97f;letter-spacing:2px;text-transform:uppercase}.brand{font-family:Georgia,serif;font-size:27px;font-weight:bold;letter-spacing:-.9px;margin:2px 0}.sub{color:#95a6b1;font-size:11px}.avatar{border:1px solid #53655b;background:#24352f;border-radius:14px;width:44px;height:44px;color:#e6c78c;font:24px Georgia,serif}.content{padding:4px 18px}.hero{padding:21px;background:linear-gradient(130deg,#25433c,#172e36 60%,#14202b);border:1px solid #4b675f;border-radius:22px;position:relative;overflow:hidden;box-shadow:0 14px 38px #0004}.hero:after{content:"";pointer-events:none;position:absolute;right:-52px;top:-65px;width:190px;height:190px;border-radius:50%;border:1px solid #b9cfac24;box-shadow:0 0 0 28px #adbf9d0a,0 0 0 62px #aec3a20a}.hero>*{position:relative;z-index:1}.serif{font-family:Georgia,serif}.headline{font-family:Georgia,serif;font-size:28px;line-height:1.14;letter-spacing:-.5px;margin:12px 0}.gold{color:#e5c88e}.row{display:flex;align-items:center;justify-content:space-between;gap:9px}.pill{display:inline-block;border:1px solid #667b71;border-radius:99px;padding:6px 10px;font-size:10px;letter-spacing:.65px;color:#ebe1bd}.button{border:0;border-radius:12px;padding:12px 15px;background:#dfbf82;color:#16232a;font-size:12px;font-weight:850}.button.alt{background:#263943;color:#e7eae6;border:1px solid #47606a}.button.danger{background:#5a2f35;color:#ffdcda}.button.small{padding:9px 12px;font-size:11px}.button.full{width:100%}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin:12px 0}.stat{background:#15232e;border:1px solid #2e414d;padding:14px 7px;border-radius:15px;text-align:center}.stat b{display:block;font-size:19px;margin-bottom:4px}.stat span{font-size:9px;text-transform:uppercase;letter-spacing:.7px;color:#92a5ae}.section{display:flex;justify-content:space-between;align-items:center;margin:23px 3px 12px}.section h2{font-family:Georgia,serif;font-size:21px;margin:0}.section small{font-size:10px;color:#9babb4}.panel{padding:16px;margin-bottom:12px;background:#14222e;border:1px solid #2e414e;border-radius:17px}.small{font-size:11px}.muted{color:#97aab5}.line{height:1px;background:#30414b;margin:13px 0}.fixture{display:flex;align-items:center;justify-content:space-between;gap:7px}.club{flex:1;text-align:center;min-width:0}.club strong{display:block;font-size:12px;margin-top:7px}.crest{--c:#657b80;height:45px;width:43px;margin:auto;display:grid;place-items:center;background:linear-gradient(135deg,var(--c),#111d2a);clip-path:polygon(50% 0,95% 18%,90% 75%,50% 100%,10% 75%,5% 18%);color:#f8edd4;font:20px Georgia,serif}.vs{font:23px Georgia,serif;color:#e0c58f}.nav{position:fixed;z-index:20;bottom:0;left:50%;transform:translateX(-50%);width:min(480px,100%);display:grid;grid-template-columns:repeat(5,1fr);padding:9px 5px calc(12px + env(safe-area-inset-bottom));background:#101d29f7;backdrop-filter:blur(20px);border-top:1px solid #344a56}.nav button{background:none;color:#8ca0ab;border:0;display:flex;flex-direction:column;align-items:center;gap:5px;font-size:9px}.nav button.active{color:#e1c18b}.nav svg{width:21px;height:21px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linejoin:round;stroke-linecap:round}.tabs{display:flex;gap:7px;margin:7px 0 14px;overflow-x:auto;scrollbar-width:none}.tab{flex:none;border:1px solid #394f5d;background:#1b2c38;color:#a9bbc5;border-radius:10px;padding:10px 12px;font-size:11px}.tab.active{color:#17232a;background:#dfbf82;border-color:#dfbf82;font-weight:850}.item{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:11px 0;border-bottom:1px solid #293a45}.item:last-child{border:0}.pos{padding:7px 5px;border-radius:7px;background:#293f49;color:#c6dee0;font-size:10px;font-weight:800;min-width:37px;text-align:center}.rating{padding:6px 9px;border-radius:8px;background:#304841;color:#c9efd0;font-weight:800;font-size:12px}.name{font-size:13px;font-weight:750}.meta{font-size:10px;color:#91a5b1;margin-top:4px}.pitch{height:368px;border:3px solid #3e7563;border-radius:16px;background:repeating-linear-gradient(0deg,#205047 0,#205047 49px,#24594c 49px,#24594c 98px);position:relative;overflow:hidden;margin:12px 0}.pitch:before{content:"";position:absolute;inset:13px;border:1px solid #c3e6d064;pointer-events:none}.pitch:after{content:"";position:absolute;width:84px;height:84px;border:1px solid #c3e6d064;border-radius:100%;top:50%;left:50%;transform:translate(-50%,-50%);pointer-events:none}.midline{position:absolute;left:13px;right:13px;top:50%;border-top:1px solid #c3e6d064}.playerdot{position:absolute;transform:translate(-50%,-50%);display:flex;flex-direction:column;align-items:center;width:70px;gap:3px;z-index:2}.shirt{width:30px;height:30px;background:#e5bf79;clip-path:polygon(25% 0,40% 7%,60% 7%,75% 0,100% 23%,85% 50%,77% 41%,77% 100%,23% 100%,23% 41%,15% 50%,0 23%);color:#19262c;font-size:12px;font-weight:900;display:grid;place-items:center;padding-top:5px}.playerdot span{font-size:9px;color:#fff;text-shadow:0 1px 4px black;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:68px}.controls{display:grid;grid-template-columns:1fr 1fr;gap:9px}.select{width:100%;padding:11px;background:#1f3240;color:#f3f0e8;border:1px solid #435866;border-radius:11px}.table{width:100%;border-collapse:collapse;font-size:11px}.table th{color:#94a8b5;font-size:9px;text-transform:uppercase;padding:9px 5px;text-align:right}.table td{padding:11px 5px;border-top:1px solid #2b3d4a;text-align:right}.table th:nth-child(2),.table td:nth-child(2){text-align:left}.table tr.mine{background:#294038}.rank{text-align:center!important;color:#d2b883}.result{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid #293c48;font-size:12px}.result:last-child{border:0}.tag{font-size:9px;border:1px solid #536761;border-radius:7px;padding:5px 7px;color:#e5ca94}.bar{height:5px;background:#334753;border-radius:9px;overflow:hidden}.bar i{display:block;height:100%;background:#d7b57d}.event{font-size:12px;background:#1d3039;border-left:2px solid #dfbd7e;margin:8px 0;padding:10px;border-radius:0 9px 9px 0}.event b{color:#e8c98f}.dialogback{position:fixed;z-index:30;inset:0;background:#03070bd4;display:grid;place-items:center;padding:20px}.dialog{width:min(420px,100%);max-height:85dvh;overflow:auto;background:#192a36;border:1px solid #506471;padding:24px;border-radius:20px;box-shadow:0 20px 50px #0008}.dialog h2{font-family:Georgia,serif;font-size:24px;margin:8px 0}.toast{position:fixed;bottom:100px;left:50%;transform:translateX(-50%);width:min(420px,90%);z-index:29;background:#e2c58c;color:#17232a;padding:13px;border-radius:11px;font-size:12px;font-weight:800;box-shadow:0 8px 30px #0008}.footer{text-align:center;font-size:9px;color:#657984;margin:28px 0 7px}.empty{text-align:center;padding:24px 9px;color:#a4b4bc;font-size:12px}.investment{display:grid;grid-template-columns:1fr auto;align-items:center;gap:12px}.number{font-variant-numeric:tabular-nums}
</style></head><body><div id="app"></div><script>
"use strict";
const KEY="forgeframe-touchline-v1";
const CLUBS=[["Northbridge FC","NBR","#987b44",64],["Royal Borough","RBY","#763751",70],["Eastport Athletic","EAS","#2a7f92",66],["Westhaven United","WHU","#435f9e",65],["Kingsford City","KFC","#aa6539",72],["Riverside Rovers","RVR","#5a8f77",61],["Ironvale FC","IRN","#78808b",63],["Southgate Albion","SGA","#7d8e49",67]];
const FIRST=["Oliver","Liam","Noah","Theo","Ethan","Lucas","Oscar","Finn","Mason","Leo","Adam","Isaac","Harry","Jude","Ryan","Daniel","Alex","Sam","Max","Jamie","Kai","Callum","Ben","Ellis","Elliot","Aaron","Nathan","George","Dylan","Jacob"];
const LAST=["Carter","Bennett","Reed","Morris","Walker","Taylor","Foster","Clarke","Turner","Morgan","Hayes","Parker","Wright","Cooper","Bailey","Hughes","Bell","Murray","Brooks","Wood","Price","Lewis","Ward","Evans","Fisher","Cole","Gray","Hill"];
const POS=["GK","RB","CB","CB","LB","CDM","CM","CM","RW","LW","ST","GK","CB","LB","CM","RW","ST","RB"];
const ICON={home:'<path d="m3 10 9-7 9 7v10H3z"/><path d="M9 20v-7h6v7"/>',squad:'<circle cx="9" cy="8" r="3"/><path d="M2 21v-3a7 7 0 0 1 14 0v3"/><path d="M17 5a3 3 0 0 1 0 6M18 14a6 6 0 0 1 4 6"/>',tactics:'<rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="12" cy="12" r="3"/><path d="M3 12h6m6 0h6M12 3v6m0 6v6"/>',league:'<path d="M7 3h10v7a5 5 0 0 1-10 0zM7 5H3v3a4 4 0 0 0 4 4m10-7h4v3a4 4 0 0 1-4 4M12 15v5m-4 1h8"/>',club:'<path d="M4 21V5l8-3 8 3v16M2 21h20M9 21v-7h6v7M8 8h1m6 0h1"/>',market:'<path d="M4 8h16l-1 13H5zM9 9V6a3 3 0 0 1 6 0v3"/>'};
let view="home",filter="ALL",marketFilter="ALL",notification="",dialog=null,seasonMessage="";
const $=id=>document.getElementById(id);
function rng(n){let x=(n+0x6D2B79F5)|0;x=Math.imul(x^(x>>>15),x|1);x^=x+Math.imul(x^(x>>>7),x|61);return ((x^(x>>>14))>>>0)/4294967296}
const round=n=>Math.round(n),fmt=n=>"£"+(Math.abs(n)>=1000000?(n/1000000).toFixed(2)+"m":Math.abs(n)>=1000?(n/1000).toFixed(0)+"k":round(n).toLocaleString());
function makePlayer(id,pos,seed,base){let a=rng(seed*31+1),b=rng(seed*17+29),c=rng(seed*23+13),ovr=Math.max(48,Math.min(91,round(base+(a-.5)*19)));return {id,name:FIRST[Math.floor(a*FIRST.length)]+" "+LAST[Math.floor(b*LAST.length)],pos,age:18+Math.floor(c*16),ovr,potential:Math.min(95,ovr+Math.floor(rng(seed+75)*14)),fitness:100,morale:70,value:Math.max(15000,round(Math.pow(ovr/60,5)*110000)),wage:round(Math.pow(ovr/60,4)*650),goals:0,apps:0};}
function schedule(){let ids=[0,1,2,3,4,5,6,7],list=[];for(let leg=0;leg<2;leg++){let a=ids.slice();for(let r=0;r<7;r++){let pair=[];for(let j=0;j<4;j++){let h=a[j],v=a[7-j];pair.push((r+leg)%2?[v,h]:[h,v]);}list.push(pair);a=[a[0],a[7],...a.slice(1,7)];}}return list;}
function newGame(){let clubs=CLUBS.map((x,i)=>({id:i,name:x[0],short:x[1],color:x[2],power:x[3],p:0,w:0,d:0,l:0,gf:0,ga:0,pts:0}));let squad=POS.map((p,i)=>makePlayer(i+1,p,i+21,62)),market=Array.from({length:15},(_,i)=>makePlayer(100+i,["GK","RB","CB","LB","CDM","CM","RW","LW","ST"][i%9],i+300,57+i%6));return {version:1,club:0,level:4,season:1,week:0,budget:1250000,balance:650000,capacity:3500,stadium:1,academy:1,training:1,fanbase:2600,fanMood:65,board:63,squad,market,clubs,fixtures:schedule(),history:[],news:["Welcome to Northbridge FC. The board expects a competitive campaign.","Your journey begins in Division Four. Promotion is the dream."],formation:"4-3-3",mentality:"Balanced",press:"Standard",trainingFocus:"Balanced",match:null,lastPrize:0,seed:1};}
let state;try{state=JSON.parse(localStorage.getItem(KEY))}catch(e){}if(!state||state.version!==1)state=newGame();
function save(){try{localStorage.setItem(KEY,JSON.stringify(state))}catch(e){}}
function notify(t){notification=t;render();setTimeout(()=>{if(notification===t){notification="";render()}},2600)}
const club=id=>state.clubs[id],home=()=>club(state.club),levelName=()=>["Premier Division","Championship","Division One","Division Two","Division Three"][state.level]||"Division Four";
function section(t,s=""){return '<div class="section"><h2>'+t+'</h2><small>'+s+'</small></div>'}
function crest(c){return '<div class="crest" style="--c:'+c.color+'">'+c.short[0]+'</div>'}
function bar(value){return '<div class="bar"><i style="width:'+Math.max(0,Math.min(100,value))+'%"></i></div>'}
function button(label,action,cls=""){return '<button class="button '+cls+'" onclick="'+action+'">'+label+'</button>'}
function head(){return '<header class="top"><div><div class="eyebrow">ForgeFrame Studio presents</div><div class="brand">TOUCHLINE<span class="gold">.</span></div><div class="sub">THE ROAD TO GLORY · '+levelName()+'</div></div><button class="avatar" onclick="openInfo()">T</button></header>'}
function navigation(){let arr=[["home","Home"],["squad","Squad"],["tactics","Tactics"],["market","Market"],["club","Club"]];return '<nav class="nav">'+arr.map(([k,label])=>'<button class="'+(view===k?"active":"")+'" onclick="go(\''+k+'\')"><svg viewBox="0 0 24 24">'+ICON[k]+'</svg>'+label+'</button>').join("")+'</nav>'}
function go(v){view=v;filter="ALL";render();window.scrollTo(0,0)}
function sorted(){return state.clubs.slice().sort((a,b)=>b.pts-a.pts||(b.gf-b.ga)-(a.gf-a.ga)||b.gf-a.gf)}
function opponent(){let match=state.fixtures[state.week];if(!match)return null;let pair=match.find(p=>p.includes(state.club));return pair?pair.find(p=>p!==state.club):null}
function strength(){let lineup=state.squad.slice(0,11),fit=lineup.reduce((s,p)=>s+p.fitness,0)/11,moral=lineup.reduce((s,p)=>s+p.morale,0)/11;let avg=lineup.reduce((s,p)=>s+p.ovr,0)/11;return avg+(fit-70)*.09+(moral-60)*.035+(state.training-1)*.8}
function fixtureCard(){let opp=opponent();if(opp===null)return '<div class="panel">Season finished. Advance to the next campaign.</div>';let h=state.fixtures[state.week].find(p=>p.includes(state.club))[0]===state.club;let left=h?home():club(opp),right=h?club(opp):home();return '<div class="panel"><div class="row"><span class="eyebrow">Matchweek '+(state.week+1)+' / 14</span><span class="tag">'+(h?"HOME":"AWAY")+'</span></div><div class="fixture" style="margin:16px 0">'+teamBadge(left)+ '<div class="vs">VS</div>'+teamBadge(right)+'</div><div class="line"></div><div class="row"><span class="small muted">League fixture · '+levelName()+'</span>'+button("PLAY MATCH","playMatch()","small")+'</div></div>'}
function teamBadge(c){return '<div class="club">'+crest(c)+'<strong>'+c.name+'</strong></div>'}
function homeScreen(){let rank=sorted().findIndex(c=>c.id===state.club)+1;return '<div class="hero"><div class="row"><span class="pill">SEASON '+state.season+' · DIVISION '+(state.level+1)+'</span><span class="eyebrow">CAREER MODE</span></div><h1 class="headline">Build a club.<br><span class="gold">Become a legend.</span></h1><p class="small muted">From forgotten terraces to the summit of football. Every decision shapes your dynasty.</p><div class="row" style="margin-top:18px"><span class="small">Managing <b>'+home().name+'</b></span><span class="small gold">★ Board '+state.board+'%</span></div></div><div class="stats"><div class="stat"><b>'+rank+'<span style="font-size:13px"> / 8</span></b><span>League rank</span></div><div class="stat"><b>'+fmt(state.balance)+'</b><span>Cash balance</span></div><div class="stat"><b>'+state.fanMood+'%</b><span>Fan support</span></div></div>'+section("Next fixture","MATCH CENTRE")+fixtureCard()+section("Club pulse","THIS SEASON")+'<div class="panel"><div class="row"><div><div class="eyebrow">Squad strength</div><div style="font-size:20px;font-weight:850;margin:6px 0">'+strength().toFixed(1)+'</div></div><div><div class="eyebrow">Transfer budget</div><div style="font-size:20px;font-weight:850;margin:6px 0">'+fmt(state.budget)+'</div></div></div>'+bar(strength())+'<div class="line"></div><div class="row"><div><div class="meta">Stadium attendance capacity</div><b>'+state.capacity.toLocaleString()+' seats</b></div>'+button("UPGRADE","go('club')","small alt")+'</div></div>'+section("Newsroom","LATEST")+'<div class="panel">'+state.news.slice(0,3).map(n=>'<div class="event">'+escapeHTML(n)+'</div>').join("")+'</div>'+section("League snapshot","TOP 4")+'<div class="panel">'+leagueTable(4)+'</div>'}
function escapeHTML(s){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function playerRow(p,transfer=false){return '<div class="item"><div style="display:flex;align-items:center;gap:11px;min-width:0"><span class="pos">'+p.pos+'</span><div style="min-width:0"><div class="name">'+escapeHTML(p.name)+'</div><div class="meta">Age '+p.age+' · '+fmt(p.value)+' · '+fmt(p.wage)+'/wk</div></div></div><div style="display:flex;align-items:center;gap:6px"><span class="rating">'+p.ovr+'</span>'+button(transfer?"SIGN":"SELL",transfer?"buy("+p.id+")":"sell("+p.id+")","small alt")+'</div></div>'}
function squadScreen(){let shown=state.squad.filter(p=>filter==="ALL"||p.pos===filter);let wages=state.squad.reduce((s,p)=>s+p.wage,0);return '<div class="eyebrow">FIRST TEAM</div><h1 class="headline">Your squad</h1><div class="stats"><div class="stat"><b>'+state.squad.length+'</b><span>Players</span></div><div class="stat"><b>'+strength().toFixed(1)+'</b><span>Starting XI</span></div><div class="stat"><b>'+fmt(wages)+'</b><span>Weekly wages</span></div></div><div class="panel"><div class="row"><span class="eyebrow">Development focus</span><span class="small gold">Level '+state.training+'</span></div><div class="line"></div><select class="select" onchange="setTraining(this.value)">'+["Balanced","Fitness","Technical","Youth"].map(x=>'<option '+(state.trainingFocus===x?"selected":"")+'>'+x+'</option>').join("")+'</select><p class="meta">Training improves players between matches. Fitness focus reduces exhaustion.</p></div>'+section("Player roster","TAP SELL TO LIST")+'<div class="tabs">'+["ALL","GK","RB","CB","LB","CDM","CM","RW","LW","ST"].map(x=>'<button class="tab '+(x===filter?"active":"")+'" onclick="setFilter(\''+x+'\')">'+x+'</button>').join("")+'</div><div class="panel">'+(shown.map(p=>playerRow(p)).join("")||'<div class="empty">No players in this position.</div>')+'</div><div class="meta">Starting XI is the first eleven players. Transfers can change depth and squad quality.</div>'}
function setFilter(x){filter=x;render()}function setMarketFilter(x){marketFilter=x;render()}function setTraining(x){state.trainingFocus=x;save();notify("Training focus: "+x)}
function positions(){let f=state.formation;if(f==="4-4-2")return [[50,88],[17,71],[39,73],[61,73],[83,71],[15,48],[39,50],[61,50],[85,48],[35,20],[65,20]];if(f==="3-5-2")return [[50,88],[23,72],[50,74],[77,72],[10,51],[33,54],[50,57],[67,54],[90,51],[35,22],[65,22]];return [[50,88],[16,73],[39,74],[61,74],[84,73],[50,58],[30,49],[70,49],[20,25],[80,25],[50,17]]}
function tacticsScreen(){let avg=round(strength()),coords=positions();return '<div class="eyebrow">TACTICAL CONTROL</div><h1 class="headline">The manager’s board</h1><div class="panel"><div class="row"><span class="eyebrow">Starting XI</span><span class="tag">'+state.formation+' · '+avg+' OVR</span></div><div class="pitch"><div class="midline"></div>'+state.squad.slice(0,11).map((p,i)=>'<div class="playerdot" style="left:'+coords[i][0]+'%;top:'+coords[i][1]+'%"><div class="shirt">'+(i+1)+'</div><span>'+escapeHTML(p.name.split(" ").pop())+'</span></div>').join("")+'</div><div class="controls"><label><span class="eyebrow">Formation</span><select class="select" onchange="tactical(\'formation\',this.value)">'+["4-3-3","4-4-2","3-5-2"].map(x=>'<option '+(state.formation===x?"selected":"")+'>'+x+'</option>').join("")+'</select></label><label><span class="eyebrow">Mentality</span><select class="select" onchange="tactical(\'mentality\',this.value)">'+["Defensive","Balanced","Attacking"].map(x=>'<option '+(state.mentality===x?"selected":"")+'>'+x+'</option>').join("")+'</select></label><label><span class="eyebrow">Pressing</span><select class="select" onchange="tactical(\'press\',this.value)">'+["Conservative","Standard","High"].map(x=>'<option '+(state.press===x?"selected":"")+'>'+x+'</option>').join("")+'</select></label></div><div class="line"></div><div class="small muted">Higher pressing and attacking mentality can create more chances, but expose your defence and tire the squad faster. Formations affect matchup performance.</div></div>'+section("Match intelligence","MANAGER’S NOTES")+'<div class="panel"><div class="event">Your '+state.formation+' uses a '+state.mentality.toLowerCase()+' approach with '+state.press.toLowerCase()+' pressing.</div><div class="event">Current average fitness: '+round(state.squad.slice(0,11).reduce((s,p)=>s+p.fitness,0)/11)+'%. Rotate through smart transfers and conditioning.</div></div>'}
function tactical(k,v){state[k]=v;save();notify("Tactics updated")}
function marketScreen(){let candidates=state.market.filter(p=>marketFilter==="ALL"||p.pos===marketFilter);return '<div class="eyebrow">RECRUITMENT DEPARTMENT</div><h1 class="headline">Transfer market</h1><div class="hero"><div class="row"><span class="pill">SUMMER WINDOW · OPEN</span><span class="eyebrow">SCOUTING</span></div><h2 class="headline" style="font-size:24px">Find the next<br><span class="gold">hidden gem.</span></h2><p class="small muted">Recruit prospects, manage wages and discover talent. Every pound matters.</p><div class="row"><b style="font-size:21px">'+fmt(state.budget)+'</b>'+button("SCOUT NEW","scout()","small")+'</div></div>'+section("Available players",state.market.length+" TARGETS")+'<div class="tabs">'+["ALL","GK","CB","CM","ST","RW","LW"].map(x=>'<button class="tab '+(x===marketFilter?"active":"")+'" onclick="setMarketFilter(\''+x+'\')">'+x+'</button>').join("")+'</div><div class="panel">'+(candidates.map(p=>playerRow(p,true)).join("")||'<div class="empty">No players found. Try another position or scout.</div>')+'</div>'}
function clubScreen(){let stadiumCost=state.stadium*420000,academyCost=state.academy*270000,trainCost=state.training*210000;return '<div class="eyebrow">CLUB OPERATIONS</div><h1 class="headline">Build your dynasty</h1><div class="hero"><span class="pill">'+home().name+'</span><h2 class="headline">From the terraces<br><span class="gold">to the top flight.</span></h2><p class="small muted">A great club is built off the pitch, too. Invest in the future.</p></div><div class="stats"><div class="stat"><b>'+fmt(state.balance)+'</b><span>Cash</span></div><div class="stat"><b>'+state.capacity.toLocaleString()+'</b><span>Capacity</span></div><div class="stat"><b>'+state.board+'%</b><span>Board faith</span></div></div>'+section("Infrastructure","CAPITAL PROJECTS")+upgrade("stadium","Stadium expansion","Increase capacity by 2,000 seats. Higher matchday revenue and prestige.","🏟",stadiumCost)+upgrade("academy","Youth academy","Improve young players’ development and discover stronger prospects.","✦",academyCost)+upgrade("training","Training centre","Better player progression, fitness and match preparation.","◆",trainCost)+section("Season finances","OVERVIEW")+'<div class="panel"><div class="result"><span class="muted">Transfer funds</span><b>'+fmt(state.budget)+'</b></div><div class="result"><span class="muted">Available cash</span><b>'+fmt(state.balance)+'</b></div><div class="result"><span class="muted">Wage bill / week</span><b>'+fmt(state.squad.reduce((s,p)=>s+p.wage,0))+'</b></div><div class="result"><span class="muted">Supporters</span><b>'+state.fanbase.toLocaleString()+'</b></div></div>'+section("Career controls","LOCAL SAVE")+'<div class="panel"><p class="small muted">Your career automatically saves on this device. Resetting permanently deletes this save.</p>'+button("RESET CAREER","confirmReset()","danger small")+'</div>'}
function upgrade(type,title,desc,symbol,cost){return '<div class="panel investment"><div><div class="eyebrow">'+symbol+' · LEVEL '+state[type]+'</div><div class="name" style="font-size:16px;margin:6px 0">'+title+'</div><div class="small muted">'+desc+'</div></div>'+button(fmt(cost),'upgrade(\''+type+'\')',"small alt")+'</div>'}
function leagueTable(limit){let rows=sorted().slice(0,limit||8);return '<table class="table"><thead><tr><th>#</th><th>Club</th><th>P</th><th>GD</th><th>Pts</th></tr></thead><tbody>'+rows.map((c,i)=>'<tr class="'+(c.id===state.club?"mine":"")+'"><td class="rank">'+(i+1)+'</td><td>'+c.name+'</td><td>'+c.p+'</td><td>'+((c.gf-c.ga)>0?"+":"")+(c.gf-c.ga)+'</td><td><b>'+c.pts+'</b></td></tr>').join("")+'</tbody></table>'}
function leagueScreen(){return '<div class="eyebrow">DOMESTIC COMPETITION</div><h1 class="headline">'+levelName()+'</h1><div class="panel"><div class="row"><span class="pill">SEASON '+state.season+'</span><span class="eyebrow">WEEK '+state.week+' / 14</span></div><div class="line"></div>'+leagueTable()+'<div class="line"></div><p class="meta">Top 2 gain automatic promotion. Bottom 2 risk relegation. Win promotion to reach the Premier Division.</p></div>'+section("Recent results","FIXTURE ARCHIVE")+'<div class="panel">'+(state.history.length?state.history.slice(-8).reverse().map(m=>'<div class="result"><div class="small">'+m.home+' <b>'+m.hs+'–'+m.as+'</b> '+m.away+'</div><span class="tag">WK '+m.week+'</span></div>').join(""):'<div class="empty">No matches played yet.</div>')+'</div>'}
function strengthClub(id){if(id===state.club)return strength();return club(id).power+(4-state.level)*6+(state.season-1)*.4}
function poisson(lambda,seed){let p=Math.exp(-lambda),s=1,k=0;do{k++;s*=Math.max(.000001,rng(seed+k*19))}while(s>p&&k<8);return k-1}
function matchGoals(h,a,seed){let diff=strengthClub(h)-strengthClub(a);let attH=1.3+Math.max(-.65,Math.min(.9,diff*.025)),attA=1.03+Math.max(-.65,Math.min(.9,-diff*.025));if(h===state.club||a===state.club){let own=h===state.club,attack=state.mentality==="Attacking"?.28:state.mentality==="Defensive"?-.22:0,press=state.press==="High"?.17:state.press==="Conservative"?-.08:0;let strat=attack+press;if(state.formation==="4-3-3"&&state.mentality==="Attacking")strat+=.12;if(state.formation==="4-4-2"&&state.mentality==="Defensive")strat+=.09;if(own){attH+=strat;attA+=attack*.48+press*.3}else{attA+=strat;attH+=attack*.48+press*.3}}return [poisson(Math.max(.13,attH),seed+9),poisson(Math.max(.13,attA),seed+129)]}
function applyResult(h,a,gh,ga){let x=club(h),y=club(a);x.p++;y.p++;x.gf+=gh;x.ga+=ga;y.gf+=ga;y.ga+=gh;if(gh>ga){x.w++;x.pts+=3;y.l++}else if(gh<ga){y.w++;y.pts+=3;x.l++}else{x.d++;y.d++;x.pts++;y.pts++}}
function playMatch(){if(state.week>=14){notify("Season complete");return}let pair=state.fixtures[state.week].find(p=>p.includes(state.club)),h=pair[0],a=pair[1],score=matchGoals(h,a,state.season*1000+state.week*199+state.seed++),timeline=[];for(let g=0;g<score[0];g++){let minute=5+Math.floor(rng(state.seed*30+g*8)*85);timeline.push({minute,msg:"GOAL · "+club(h).name})}for(let g=0;g<score[1];g++){let minute=5+Math.floor(rng(state.seed*55+g*18)*85);timeline.push({minute,msg:"GOAL · "+club(a).name})}timeline.sort((x,y)=>x.minute-y.minute);timeline.unshift({minute:0,msg:"Kick-off. The crowd roars."});timeline.push({minute:90,msg:"Full-time whistle."});state.match={h,a,gh:score[0],ga:score[1],timeline};dialog="match";render()}
function finishMatch(){let m=state.match;if(!m)return;let pairings=state.fixtures[state.week];pairings.forEach(([h,a],i)=>{let goals=(h===m.h&&a===m.a)?[m.gh,m.ga]:matchGoals(h,a,state.season*1000+state.week*211+i*71+state.seed);applyResult(h,a,...goals);state.history.push({home:club(h).short,away:club(a).short,hs:goals[0],as:goals[1],week:state.week+1})});let ownHome=m.h===state.club,forGoals=ownHome?m.gh:m.ga,against=ownHome?m.ga:m.gh,won=forGoals>against,draw=forGoals===against;let gate=round(Math.min(state.capacity,state.fanbase)* (14+state.level*2)),prize=won?160000:draw?75000:35000,wages=state.squad.reduce((s,p)=>s+p.wage,0);state.balance+=gate+prize-wages;state.budget+=round(prize*.3);state.fanMood=Math.max(10,Math.min(99,state.fanMood+(won?5:draw?0:-5)));state.board=Math.max(12,Math.min(99,state.board+(won?4:draw?0:-4)));state.fanbase=Math.max(600,state.fanbase+(won?170:draw?40:-55));state.squad.forEach((p,i)=>{let fatigue=i<11?(state.press==="High"?20:state.press==="Conservative"?9:14):2;p.fitness=Math.max(38,Math.min(100,p.fitness-fatigue+(state.trainingFocus==="Fitness"?11:5)+(state.training-1)*2));p.morale=Math.max(32,Math.min(99,p.morale+(won?4:draw?1:-3)));if(i<11)p.apps++;if(state.trainingFocus==="Youth"&&p.age<=23&&rng(state.seed+p.id+state.week)>.7)p.ovr=Math.min(p.potential,p.ovr+1);else if(state.trainingFocus==="Technical"&&rng(state.seed+p.id+state.week)>.92)p.ovr=Math.min(p.potential,p.ovr+1)});state.news.unshift((won?"Victory! ":draw?"Points shared. ":"Defeat. ")+home().name+" "+forGoals+"–"+against+" "+club(ownHome?m.a:m.h).name+". Matchday income "+fmt(gate)+".");state.news=state.news.slice(0,10);state.week++;state.match=null;dialog=null;if(state.week>=14)endSeason();save();go("home")}
function endSeason(){let position=sorted().findIndex(c=>c.id===state.club)+1,promoted=position<=2&&state.level>0,relegated=position>=7&&state.level<4;let prize=promoted?1500000:position<=4?600000:250000;state.balance+=prize;state.budget+=round(prize*.55);state.lastPrize=prize;seasonMessage="Season "+state.season+" finished: "+position+(position===1?"st":position===2?"nd":position===3?"rd":"th")+" place. "+(promoted?"PROMOTED! You are heading up a division!":relegated?"Relegated. Rebuild and come back stronger.":position<=2?"Champions of the top division!":"The next chapter begins.")+" Prize money: "+fmt(prize)+".";if(promoted)state.level--;if(relegated)state.level++;state.season++;state.week=0;state.clubs.forEach((c,i)=>{c.p=c.w=c.d=c.l=c.gf=c.ga=c.pts=0;if(i!==state.club)c.power=Math.min(86,c.power+round((rng(state.seed+i)*4)-1))});state.fixtures=schedule();state.squad.forEach(p=>{p.age++;p.fitness=100;p.goals=0;p.apps=0;if(p.age<=25&&rng(state.seed+p.id)>.4)p.ovr=Math.min(p.potential,p.ovr+1)});state.market=Array.from({length:15},(_,i)=>makePlayer(1000+state.season*100+i,["GK","RB","CB","LB","CDM","CM","RW","LW","ST"][i%9],i+300+state.season*60,59+(4-state.level)*5));state.news.unshift(seasonMessage);dialog="season"}
function buy(id){let p=state.market.find(x=>x.id===id);if(!p)return;if(state.squad.length>=25){notify("Maximum 25 players in squad");return}if(state.budget<p.value||state.balance<p.value){notify("Insufficient transfer funds or cash");return}state.budget-=p.value;state.balance-=p.value;state.squad.push(p);state.market=state.market.filter(x=>x.id!==id);state.news.unshift("SIGNED: "+p.name+" joins for "+fmt(p.value)+".");save();notify("Signing complete: "+p.name)}
function sell(id){let index=state.squad.findIndex(p=>p.id===id);if(index<0)return;if(state.squad.length<=11){notify("You must keep at least eleven players");return}let p=state.squad[index];let price=round(p.value*(.77+rng(state.seed++)*.3));state.squad.splice(index,1);state.budget+=price;state.balance+=price;state.news.unshift("SOLD: "+p.name+" for "+fmt(price)+".");save();notify("Player sold for "+fmt(price))}
function scout(){let cost=40000;if(state.balance<cost){notify("Scouting needs "+fmt(cost)+" cash");return}state.balance-=cost;let k=state.season*2000+state.seed++,p=makePlayer(k,["GK","RB","CB","LB","CDM","CM","RW","LW","ST"][Math.floor(rng(k)*9)],k,58+(4-state.level)*5+state.academy*2);state.market.unshift(p);state.news.unshift("Scouting report: "+p.name+" ("+p.ovr+" OVR) discovered.");save();notify("New scouting prospect discovered")}
function upgrade(type){let cost=type==="stadium"?state.stadium*420000:type==="academy"?state.academy*270000:state.training*210000;if(state.balance<cost){notify("Not enough cash for this investment");return}state.balance-=cost;state[type]++;if(type==="stadium")state.capacity+=2000;state.news.unshift(type[0].toUpperCase()+type.slice(1)+" upgrade completed for "+fmt(cost)+".");save();notify("Upgrade completed!")}
function confirmReset(){dialog="reset";render()}function resetCareer(){state=newGame();dialog=null;seasonMessage="";save();go("home")}function openInfo(){dialog="info";render()}
function dialogue(){if(!dialog)return "";let body="",actions="";if(dialog==="match"&&state.match){let m=state.match;body='<div class="fixture" style="margin:18px 0">'+teamBadge(club(m.h))+'<div class="vs">'+m.gh+' – '+m.ga+'</div>'+teamBadge(club(m.a))+'</div><div class="eyebrow">MATCH COMMENTARY</div><div style="max-height:230px;overflow:auto">'+m.timeline.map(e=>'<div class="event"><b>'+e.minute+"'</b> · "+e.msg+'</div>').join("")+'</div>';actions=button("FULL TIME · CONTINUE","finishMatch()","full")}else if(dialog==="season"){body='<p class="small muted">'+escapeHTML(seasonMessage)+'</p><p class="small gold">A new season awaits. Your facilities, squad and finances carry forward.</p>';actions=button("START NEW SEASON","closeDialog()","full")}else if(dialog==="reset"){body='<p class="small muted">Erase your current career and all progress? This cannot be undone.</p>';actions=button("YES, RESET","resetCareer()","danger")+" "+button("CANCEL","closeDialog()","alt")}else{body='<p class="small muted">TOUCHLINE is an original fictional football management game from ForgeFrame Studio. An early playable career prototype.</p><p class="small muted">Offline play · local device saves · no accounts or external assets.</p>';actions=button("CONTINUE","closeDialog()","full")}return '<div class="dialogback"><div class="dialog"><div class="eyebrow">FORGEFRAME STUDIO</div><h2>'+(dialog==="match"?"Matchday":dialog==="season"?"End of season":dialog==="reset"?"Reset career?":"About Touchline")+'</h2>'+body+'<div style="margin-top:17px">'+actions+'</div></div></div>'}
function closeDialog(){dialog=null;save();render()}
function render(){let screens={home:homeScreen,squad:squadScreen,tactics:tacticsScreen,market:marketScreen,club:clubScreen,league:leagueScreen};$("app").innerHTML=head()+'<main class="content">'+screens[view]()+'<div class="footer">© FORGEFRAME STUDIO · TOUCHLINE v0.1</div></main>'+navigation()+(view==="home"?'<button onclick="go(\'league\')" style="position:fixed;right:max(calc((100vw - 480px)/2 + 20px),20px);bottom:100px;border:1px solid #64715f;background:#223931;color:#efd69b;border-radius:50%;width:49px;height:49px;z-index:9;font-size:20px">🏆</button>':"")+(notification?'<div class="toast">'+escapeHTML(notification)+'</div>':"")+dialogue()}
render();
</script></body></html>
