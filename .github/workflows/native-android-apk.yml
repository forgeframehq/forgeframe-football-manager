name: Native Android APK
on:
  push:
    branches: [native-android-career-prototype]
    paths:
      - 'native-android/**'
      - '.github/workflows/native-android-apk.yml'
  pull_request:
    branches: [main]
    paths:
      - 'native-android/**'
      - '.github/workflows/native-android-apk.yml'
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: native-android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Build native debug APK
        run: gradle :app:assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: ForgeFrame-Football-Manager-Android-APK
          path: native-android/app/build/outputs/apk/debug/app-debug.apk
